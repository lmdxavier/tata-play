: \"金币\"},\n  orb:     {lvl: 0,   xp: 0,  name: \"传送门\"},\n  sorb:    {lvl: 0,   xp: 0,  name: \"望远镜\"},\n  srats:   {lvl: 0,   xp: 0,  name: \"寻蜗卷轴\"},\n  sslimes: {lvl: 0,   xp: 0,  name: \"显形魔典\"},\n  sdisarm: {lvl: 0,   xp: 0,  name: \"冰霜符\"},\n  crown:   {lvl: 0,   xp: 0,  name: \"王冠\"},\n  irage:   {lvl: 0,   xp: 0,  name: \"狂暴\"},\n  iweak:   {lvl: 0,   xp: 0,  name: \"弱化\"},\n  ihammer: {lvl: 0,   xp: 0,  name: \"石锤\"},\n  iwind:   {lvl: 0,   xp: 0,  name: \"风之剑\"},\n  thorn:   {lvl: 0,   xp: 0,  name: \"荆棘\"},\n  rose:    {lvl: 0,   xp: 0,  name: \"玫瑰血瓶\"},\n  // v40：五种效果怪（独立的怪，打倒后自动生效；tr = 效果）\n  mcurse:  {lvl: 2,   xp: 2,  mon: 1, name: \"咒鳄龟\", tr: \"curse\"},\n  mbless:  {lvl: 3,   xp: 3,  mon: 1, name: \"金铃蛇\", tr: \"bless\"},\n  mseer:   {lvl: 3,   xp: 3,  mon: 1, name: \"灵视章鱼\", tr: \"seer\"},\n  mbrk:    {lvl: 3,   xp: 3,  mon: 1, name: \"撞角羊\", tr: \"brk\"},\n  mbomb:   {lvl: 5,   xp: 5,  mon: 1, name: \"爆刺河豚\", tr: \"bomb\"},\n};\n\nfunction mk(t, extra) {\n  const d = DEF[t];\n  const o = {t, lvl: d.lvl, xp: d.xp, mon: !!d.mon, rev: false, def: false, mark: 0,\n             name: \"\", fixed: false, mimic: t === \"mimic\", whp: 0, wmax: 0, contains: null, cx: -1, cy: -1};\n  if (d.tr) o.tr = d.tr;\n  return Object.assign(o, extra || {});\n}\n\n// ---------------------------------------------------------------- 状态\nconst PEEK = new Set(); let GAVEUP = false;\nlet cells = [], player, status = \"gen\", showAll = false, killedRats = 0, startTime = 0, killer = -1;\nlet stamps = loadStamps(), runStamps = [];\nlet soundOn = true;\nlet SIM = false;   // 广告提示在克隆局面上试走时为 true：不出声、不播演出、不弹字\nconst fx = [];\nlet shakeT = 0;\nlet PENDWIN = false, WIN_UNLOCK = -1;\n\nconst stampKey = () => \"wyrmnest_stamps\" + (typeof CUR === \"undefined\" || LEVELS[CUR].id === \"l\" ? \"\" : \"_\" + LEVELS[CUR].id);\nfunction loadStamps() { try { return JSON.parse(localStorage.getItem(stampKey()) || \"[]\"); } catch (e) { return []; } }\nfunction saveStamps() { try { localStorage.setItem(stampKey(), JSON.stringify(stamps)); } catch (e) {} }\n\nconst X = i => i % W, Y = i => (i / W) | 0;\nconst dist = (a, b) => Math.hypot(X(a) - X(b), Y(a) - Y(b));\nlet RG = {x0: 0, y0: 0, w: W, h: H};   // 本关的格子区域（其余 void）\nconst RX1 = () => RG.x0 + RG.w - 1, RY1 = () => RG.y0 + RG.h - 1;\nconst MIDX = () => RG.x0 + (RG.w - 1) / 2, DRY = () => RG.y0 + Math.floor((RG.h - 1) / 2);   // 炎龙所在列 / 行\nconst isEdge = i => X(i) === RG.x0 || Y(i) === RG.y0 || X(i) === RX1() || Y(i) === RY1();\nconst isCorner = i => (X(i) === RG.x0 || X(i) === RX1()) && (Y(i) === RG.y0 || Y(i) === RY1());\nconst nearEdge = i => X(i) \u003c= RG.x0 + 1 || Y(i) \u003c= RG.y0 + 1 || X(i) >= RX1() - 1 || Y(i) >= RY1() - 1;\n\nfunction around(i, r, fn) {\n  const R = Math.ceil(r), x0 = X(i), y0 = Y(i);\n  for (let dy = -R; dy \u003c= R; dy++) for (let dx = -R; dx \u003c= R; dx++) {\n    if (!dx && !dy) continue;\n    const x = x0 + dx, y = y0 + dy;\n    if (x \u003c 0 || y \u003c 0 || x >= W || y >= H) continue;\n    const d = Math.hypot(dx, dy);\n    if (fn(x + y * W, d) === true) return true;\n  }\n  return false;\n}\nconst near = (i, t, r) => around(i, r, (j, d) => d \u003c r && cells[j].t === t);\nfunction countNear(i, t, r) { let n = 0; around(i, r, (j, d) => { if (d \u003c r && cells[j].t === t) n++; }); return n; }\nfunction shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }\n\n// ---------------------------------------------------------------- 地图生成：分层放置 + 满意度爬山\nconst ORB_FORBID = new Set([\"dragon\", \"gazer\", \"chest\", \"sorb\", \"ratking\", \"mine\", \"egg\", \"bigslime\", \"mimic\"]);\n\nfunction happiness() {\n  let s = 0;\n  for (let i = 0; i \u003c N; i++) {\n    const c = cells[i], t = c.t;\n    if (t === \"empty\") continue;\n    const x = X(i), y = Y(i);\n    switch (t) {\n      case \"egg\": if (near(i, \"dragon\", 1.5)) s += 9000; break;\n      case \"gnome\": if (near(i, \"medikit\", 1.5)) s += 10000; break;\n      case \"guard\": if (inQuadrant(c.name, x, y)) s += 2500; break;\n      case \"giant\": {\n        const o = cells.findIndex((b, j) => b.t === \"giant\" && j !== i);\n        if (o >= 0) {\n          if ((c.name === \"A\" && x \u003c MIDX()) || (c.name === \"B\" && x > MIDX())) s += 1000;\n          if (Y(o) === y && Math.abs(x - MIDX()) === Math.abs(X(o) - MIDX())) s += 10000;\n        }\n        break;\n      }\n      case \"bigslime\": if (near(i, \"wizard\", 1.5)) s += 1000; break;\n      case \"wizard\": if (isEdge(i) && !isCorner(i)) s += 10000; break;\n      case \"mineking\": if (isCorner(i)) s += 10000; break;\n      case \"dragon\": if (x === Math.floor(MIDX()) && y === DRY()) s += 10000; break;\n      case \"mino\": {\n        let chests = 0, crowded = false;\n        around(i, 2, (j, d) => {\n          if (cells[j].t !== \"chest\" || X(j) === x || d >= 2) return;\n          chests++;\n          if (around(j, 2, (k, d2) => k !== i && d2 \u003c 2 && cells[k].t === \"mino\")) crowded = true;\n        });\n        if (chests === 1 && !crowded) s += 10000;\n        break;\n      }\n      case \"garg\": if (around(i, 1, (j, d) => d \u003c= 1 && cells[j].t === \"garg\" && cells[j].name === c.name)) s += 1000; break;\n      case \"orb\": {\n        if (nearEdge(i)) s -= 10000;\n        let forb = 0, med = 0, walls = 0;\n        around(i, 2.1, (j, d) => {\n          if (d >= 2.1) return;\n          const b = cells[j].t;\n          if (ORB_FORBID.has(b)) forb++;\n          if (b === \"medikit\") med++; else if (b === \"wall\") walls++;\n        });\n        s -= forb * 2000;\n        if (walls > 2) s -= (walls - 2) * 2000;\n        if (med === 1 && walls > 0) s += 2000;\n        break;\n      }\n      case \"medikit\": s -= 1000 * countNear(i, \"medikit\", 3.5); break;\n      case \"chest\": s -= 1000 * countNear(i, \"chest\", 3); break;\n      case \"wall\": {\n        let close = 0, far = 0, onEdge = isEdge(i) ? 1 : 0;\n        around(i, 1.5, (j, d) => {\n          if (cells[j].t !== \"wall\") return;\n          if (d \u003c= 1) { close++; if (isEdge(j)) onEdge++; } else if (d \u003c 1.5) far++;\n        });\n        if (close === 1 && far === 0 && onEdge \u003c 2) s += 2000;\n        break;\n      }\n    }\n  }\n  return s;\n}\n\nfunction inQuadrant(name, x, y) {\n  const mx = MIDX(), my = DRY();\n  if (name === \"g1\") return x \u003c mx && y \u003c my;\n  if (name === \"g2\") return x > mx && y \u003c my;\n  if (name === \"g3\") return x > mx && y > my;\n  if (name === \"g4\") return x \u003c mx && y > my;\n  return false;\n}\n\nfunction swapCells(a, b) { const t = cells[a]; cells[a] = cells[b]; cells[b] = t; }\n\nfunction layer(specs, climbOnly) {\n  const acts = [];\n  for (const [n, t, extra] of specs) for (let k = 0; k \u003c n; k++) acts.push(mk(t, extra));\n  for (const a of acts) {\n    const free = [];\n    for (let i = 0; i \u003c N; i++) if (cells[i].t === \"empty\" && !cells[i].fixed) free.push(i);\n    cells[free[Math.random() * free.length | 0]] = a;\n  }\n  const climbers = climbOnly ? acts.filter(a => climbOnly.has(a.t)) : acts;\n  let best = happiness();\n  const idx = [...Array(N).keys()];\n  for (let pass = 0; pass \u003c 4 && climbers.length; pass++) {\n    for (const a of shuffle(climbers.slice())) {\n      const ai = cells.indexOf(a);\n      let choice = -1;\n      for (const j of shuffle(idx)) {\n        if (j === ai || cells[j].fixed) continue;\n        swapCells(ai, j);\n        const h = happiness();\n        swapCells(ai, j);\n        if (h >= best) { best = h; choice = j; }\n      }\n      if (choice >= 0) swapCells(ai, choice);\n    }\n  }\n  for (const a of acts) a.fixed = true;\n}\n\nfunction generate() {\n  do genOnce(); while (!mapRulesOK());\n  assignTraits();\n}\n// 教学推理用到的位置规律：雷王在角、两巨人同行对称、石像鬼同伴上下左右相邻。爬山几乎总能满足，不满足就重生成，保证提示永远不会错\nfunction mapRulesOK() {\n  const f = t => cells.map((b, i) => b.t === t ? i : -1).filter(i => i >= 0);\n  const mk0 = f(\"mineking\");\n  if (mk0.length && !isCorner(mk0[0])) return false;\n  const g = f(\"giant\");\n  if (g.length === 2 && (Y(g[0]) !== Y(g[1]) || X(g[0]) + X(g[1]) !== 2 * MIDX())) return false;\n  for (const i of f(\"garg\")) {\n    const p = cells.findIndex((b, j) => j !== i && b.t === \"garg\" && b.name === cells[i].name);\n    if (Math.abs(X(p) - X(i)) + Math.abs(Y(p) - Y(i)) !== 1) return false;\n  }\n  return true;\n}\nfunction genOnce() {\n  cells = [];\n  const L = LV();\n  for (let i = 0; i \u003c N; i++) cells.push(X(i) >= RG.x0 && X(i) \u003c= RX1() && Y(i) >= RG.y0 && Y(i) \u003c= RY1() ? mk(\"empty\") : mk(\"void\", {rev: true, fixed: true}));\n  for (const [specs, climb] of L.layers) layer(specs, climb ? new Set(climb) : undefined);\n\n  const wallHPs = [3, 3, 3, 3, 3, 3];\n  for (let i = 0; i \u003c N; i++) {\n    const c = cells[i];\n    if (c.t === \"wall\") { c.whp = c.wmax = wallHPs.pop(); c.contains = \"t1\"; }\n    if (c.t === \"dragon\") { c.rev = true; c.lvl = c.xp = L.boss; }\n    if (c.t === \"mino\") {\n      around(i, 1.5, (j, d) => { if (d \u003c 1.5 && cells[j].t === \"chest\") { c.cx = X(j); c.cy = Y(j); return true; } });\n    }\n  }\n}\n\n// ---------------------------------------------------------------- 规则\nfunction attackNumber(i) { let s = 0; around(i, 1, j => { if (cells[j].lvl > 0) s += cells[j].lvl; }); return s; }\nfunction gazed(i) { return around(i, 2, (j, d) => d \u003c= 2 && cells[j].t === \"gazer\" && !cells[j].def); }\n\nfunction gnomeTarget() {\n  let best = -1, bd = 1e9;\n  for (let c = 0; c \u003c N; c++) {\n    if (cells[c].t !== \"empty\" || cells[c].rev) continue;\n    for (let m = 0; m \u003c N; m++) {\n      if (cells[m].t !== \"medikit\") continue;\n      const d = dist(c, m);\n      if (d \u003c bd) { bd = d; best = c; }\n    }\n  }\n  return best;\n}\n\nfunction becomeItem(i, t, extra) { const m = cells[i].mark; cells[i] = mk(t, Object.assign({rev: true, fixed: true}, extra)); cells[i].mark = m; }\nfunction becomeEmpty(i) { becomeItem(i, \"empty\"); }\nfunction openContents(i, what) {\n  if (what === \"t5\") becomeItem(i, \"treasure\", {xp: 5});\n  else if (what === \"t1\") becomeItem(i, \"treasure\", {xp: 1});\n  else if (what === \"medikit\") becomeItem(i, \"medikit\");\n  else becomeEmpty(i);\n}\n\n\n// ---------------------------------------------------------------- v38 新怪机制（docs\\新怪.md「确定方案」）\n// 特性（附在现有怪身上，每局随机挑宿主；战力、经验、线索数字都不变）：curse 诅咒 / bless 祝福 / seer 先知 / brk 破石 / bomb 爆破\n// player 上的状态（都是标量，snapshot 浅拷贝即可）：cur 诅咒剩余次数 + curHeld 锁住的那颗心；bls 祝福剩余；rage 狂暴剩余、rageN 手里的狂暴；\n// weak 弱化剩余；eye 预知次数；hammer 石锤；wind 风之剑（下一次战斗）\nconst WIND_BOSS = false;   // 风之剑对头目有没有效：待用户定，先不生效（打头目不消耗）\nconst TRAITS = [\"curse\", \"bless\", \"seer\", \"brk\", \"bomb\"];\nconst TRAIT_HOST = new Set([\"rat\", \"bat\", \"skel\", \"slime\"]);\nconst BOMB_OK = new Set([\"rat\", \"bat\", \"skel\", \"garg\", \"slime\", \"mino\", \"guard\", \"bigslime\"]);   // 爆破只炸普通怪（熊、蜗牛王、火山龟、宝箱怪等不炸）\nfunction powMod() { return player ? (player.rage > 0 ? 1 : 0) - (player.weak > 0 ? 1 : 0) : 0; }\n// v44 显示层：战斗演出期间（PV）按开打前的状态画；新得到、还在飞的状态（HOLDV）先按得到前的值画\nlet PV = null, PRE_TR = null; const HOLDV = {};\nconst PV_KEYS = [\"cur\", \"bls\", \"rage\", \"weak\", \"rageN\", \"eye\", \"wind\", \"hammer\", \"curHeld\"];\nfunction pvSnap() { if (SIM || !player) return; PV = {}; for (const k of PV_KEYS) PV[k] = player[k] | 0; for (const k in HOLDB) if (HOLDV[k]) { PV[k] = HOLDV[k][k] | 0; if (k === \"cur\") PV.curHeld = HOLDV.cur.curHeld | 0; } }\nfunction PS() { return PV || player; }\nfunction pv(k) { if (PV) return PV[k] | 0; if (HOLDB[k] && HOLDV[k]) return HOLDV[k][k] | 0; return player ? player[k] | 0 : 0; }\nfunction pvHeld() { if (PV) return PV.curHeld | 0; if (HOLDB.cur && HOLDV.cur) return HOLDV.cur.curHeld | 0; return player ? player.curHeld | 0 : 0; }\nfunction powModD() { return player ? (pv(\"rage\") > 0 ? 1 : 0) - (pv(\"weak\") > 0 ? 1 : 0) : 0; }\nfunction effPow(c) { return !c.mon || c.t === \"mine\" || c.lvl \u003c= 0 ? c.lvl : Math.max(0, c.lvl + powMod()); }\nfunction capHP() { return player.maxHP + (player.bls > 0 ? 1 : 0) - (player.cur > 0 ? 1 : 0); }\nfunction assignTraits() {\n  const T = LV().traits; if (!T) return;\n  const pool = shuffle(cells.map((c, i) => TRAIT_HOST.has(c.t) ? i : -1).filter(i => i >= 0));\n  for (const k of TRAITS) for (let n = T[k] || 0; n > 0 && pool.length; n--) cells[pool.pop()].tr = k;\n}\nfunction v38fx(kind, d) { if (!SIM && typeof newFx === \"function\") newFx(kind, d); }\n// 荆棘：翻开就开始数（3 次战斗）\nfunction thornScan() { for (const c of cells) if (c.t === \"thorn\" && c.rev && !c.st) { c.st = 1; c.tn = 3; c.ts = 0; } }\n// 一次战斗打赢后：bp = 这只怪这次的战力（含狂暴 / 弱化），wind = 用了风之剑\nfunction afterFight(i, bp, wind) {\n  const c = cells[i];\n  if (wind) player.wind = 0;\n  const m = powMod(); if (m) c.xp = Math.max(0, c.xp + m);\n  // 荆棘吸血（全图任何战斗都算）\n  for (let j = 0; j \u003c N; j++) {\n    const t = cells[j]; if (t.t !== \"thorn\" || !(t.tn > 0)) continue;\n    const old = Object.assign({}, t);\n    t.ts += bp; t.tn--;\n    const bloom = t.tn === 0, heal = t.ts;\n    if (bloom) becomeItem(j, \"rose\", {heal});\n    v38fx(\"sip\", {from: i, to: j, bloom, old});\n  }\n  // 计次：这一次战斗算进已经生效的状态\n  const renew = c.tr === \"bless\" && player.bls === 1 ? \"bls\" : c.tr === \"curse\" && player.cur === 1 ? \"cur\" : \"\";   // v45：只剩 1 次又中同一种 → 直接续期\n  if (player.rage > 0) player.rage--;\n  if (player.weak > 0) player.weak--;\n  if (renew !== \"cur\" && player.cur > 0 && --player.cur === 0) { if (player.curHeld) { player.curHeld = 0; player.hp = Math.min(capHP(), player.hp + 1); v38fx(\"unlock\"); } }\n  if (renew !== \"bls\" && player.bls > 0 && --player.bls === 0) { if (player.hp > capHP()) player.hp = capHP(); v38fx(\"blsEnd\"); }\n  // 特性：打倒后生效（从这只之后的战斗开始算）\n  const tr = c.tr; if (!tr) return;\n  if (!SIM) PRE_TR = {cur: player.cur | 0, bls: player.bls | 0, eye: player.eye | 0, curHeld: player.curHeld | 0};\n  if (tr === \"curse\") {\n    v38fx(\"curse\");\n    if (player.cur > 0) player.cur = 3;\n    else { player.cur = 3; if (player.hp >= 2) { player.hp--; player.curHeld = 1; v38fx(\"lock\"); } else player.curHeld = 0; }\n  } else if (tr === \"bless\") {\n    if (player.bls > 0) player.bls = 3; else { player.bls = 3; player.hp++; }\n    v38fx(\"bless\");\n  } else if (tr === \"seer\") { player.eye = (player.eye | 0) + 1; v38fx(\"seer\"); }\n  else if (tr === \"brk\") {\n    const list = []; around(i, 1, j => { if (!cells[j].rev && cells[j].t !== \"void\") list.push(j); });\n    const pick = shuffle(list).slice(0, 3);\n    for (const j of pick) cells[j].rev = true;\n    v38fx(\"brk\", {src: i, cells: pick});\n  } else if (tr === \"bomb\") {\n    const list = []; around(i, 1, j => { const b = cells[j]; if (b.mon && !b.def && b.lvl > 0 && !b.tr && BOMB_OK.has(b.t) && !(b.t === \"mimic\")) list.push(j); });\n    const pick = shuffle(list).slice(0, 3), was = pick.map(j => cells[j].rev);\n    for (const j of pick) { const b = cells[j]; b.rev = true; b.def = true; }\n    v38fx(\"bomb\", {src: i, cells: pick, was});\n  }\n}\nfunction useEye(j) {\n  if (!(player.eye > 0) || j \u003c 0 || cells[j].rev || cells[j].t === \"void\") return false;\n  player.eye--; cells[j].rev = true; thornScan(); v38fx(\"eye\", {i: j}); return true;\n}\nfunction useRage() {\n  if (!(player.rageN > 0) || player.rage > 0) return false;\n  player.rageN--; player.rage = 3; v38fx(\"rage\"); return true;\n}\n\n\n// ---------------------------------------------------------------- v23 关卡\n// 每关独立：1 级 6 血开始；打倒炎龙即过关。数值见 docs\\玩法与数值.md「关卡配置」\n// v29：每种怪战力全关固定；Boss 每关换一个（cell 类型仍叫 \"dragon\" = 头目位：开局可见、站中列、打倒即过关），龙只在第 10 关\nconst BOSS = {\n  b_dwarf: {name: \"独眼矮人\", pow: 6}, b_yeti: {name: \"雪怪\", pow: 7}, b_snake: {name: \"眼镜王蛇\", pow: 8},\n  b_bear: {name: \"熊王\", pow: 9}, b_orc: {name: \"山岭巨魔\", pow: 10}, b_bird: {name: \"黑羽巨鸦\", pow: 11}, b_lich: {name: \"巫妖\", pow: 12}, dragon: {name: \"炎龙\", pow: 13},\n};\nconst BOSS_KEYS = Object.keys(BOSS);\nconst TEST \"l\":{\"up\":1,\"heal\":0.34}}}};\nfunction setDiff(d) { DIFF = d | 0; DLVC = null; }\nfunction diffP() { const L = LEVELS[CUR]; return Object.assign({}, DIFFT[DIFF], ((DIFFT[DIFF] || {}).lv || {})[L && L.id]); }   // lv：按关覆盖\nfunction diffHP() { return DIFF ? 6 + (diffP().hp | 0) : 6; }   // 开局血量\nfunction diffLv() {\n  const L = LEVELS[CUR];\n  if (!DIFF || !L || !L.layers) return L;\n  if (DLVC && DLVC.k === CUR && DLVC.d === DIFF) return DLVC.L;\n  const P = diffP();\n  const layers = JSON.parse(JSON.stringify(L.layers));\n  const find = (t, f) => { for (const [sp] of layers) for (const x of sp) if (x[1] === t && x[0] > 0 && (!f || f(x))) return x; return null; };\n  const cnt = (t, f) => { let n = 0; for (const [sp] of layers) for (const x of sp) if (x[1] === t && (!f || f(x))) n += x[0]; return n; };\n  const isMed = x => x[2] && x[2].contains === \"medikit\";\n  // heal / up 是比例（0~1）：拿掉这一关回血物的几成、把几成蜗牛换高一级；mine / hp 是加减数\n  for (let h = Math.round((P.heal || 0) * (cnt(\"medikit\") + cnt(\"chest\", isMed))); h > 0; h--) {   // 先拿掉血瓶，没有了就把装血瓶的宝箱换成装经验的\n    const m = find(\"medikit\"); if (m) { m[0]--; continue; }\n    const c = find(\"chest\", isMed); if (!c) break;\n    c[0]--; const t5 = find(\"chest\", x => x[2] && x[2].contains === \"t5\"); if (t5) t5[0]++;\n  }\n  if (P.mine) { const m = find(\"mine\"); if (m) m[0] += P.mine; }\n  let u = Math.round((P.up || 0) * cnt(\"rat\"));   // 蜗牛 → 甲虫，不够再甲虫 → 石蟹\n  for (const [a, b] of [[\"rat\", \"bat\"], [\"bat\", \"skel\"]]) while (u > 0) { const x = find(a, y => y[0] > 1), y = find(b); if (!x || !y) break; x[0]--; y[0]++; u--; }\n  for (const ly of layers) ly[0] = ly[0].filter(x => x[0] > 0);\n  DLVC = {k: CUR, d: DIFF, L: Object.assign({}, L, {layers}, L.boss ? {boss: L.boss + (P.boss | 0)} : {})};   // boss：头目战力加减\n  return DLVC.L;\n}\nconst LV = () => DIFF ? diffLv() : LEVELS[CUR];\nfunction setRegion(L) { RG = L && L.w ? {x0: (W - L.w) >> 1, y0: (H - L.h) >> 1, w: L.w, h: L.h} : {x0: 0, y0: 0, w: W, h: H}; }\ }\n  for (let round = 0; round \u003c 40; round++) {\n    let ch = false;\n    for (const con of cons) if (propagate(con)) ch = true;\n    if (counts()) ch = true;\n    if (!ch) break;\n  }\n  // 第二步：把挨着数字的未知格按\"共用数字\"分组，逐组穷举所有满足全部数字的组合（同时数一下概率）。\n  // 穷举只用真实约束剪枝，所以\"不可能的值\"结论依然可靠；组合太多就放弃这一组，保留上面的结果。\n  const prob = enumerateGroups();\n  if (prob.changed) for (let round = 0; round \u003c 40; round++) {\n    let ch = false;\n    for (const con of cons) if (propagate(con)) ch = true;\n    if (counts()) ch = true;\n    if (!ch) break;\n  }\n  return {vars, vi, dom, why, rem, dmax, hidden, prob: prob.p};\n\n  function enumerateGroups() {\n    const nV = vars.length, totalRem = nV;\n    const prior = {}; for (const v of ALLV) prior[v] = rem[v] / Math.max(1, totalRem);\n    const vc = vars.map(() => []);\n    cons.forEach((c, ci) => c.U.forEach(k => vc[k].push(ci)));\n    const p = vars.map(() => null);\n    const seen = new Uint8Array(nV);\n    const expUsed = {}; for (const v of ALLV) expUsed[v] = 0;\n    let changed = false, seaN = 0;\n    for (let k0 = 0; k0 \u003c nV; k0++) {\n      if (seen[k0]) continue;\n      if (!vc[k0].length) { seen[k0] = 1; seaN++; continue; }\n      // 找出这一组（BFS 顺序 = 穷举顺序，越早碰到的约束越早能剪枝）\n      const order = [k0], gc = new Set(); seen[k0] = 1;\n      for (let q = 0; q \u003c order.length; q++) for (const ci of vc[order[q]]) {\n        gc.add(ci);\n        for (const k of cons[ci].U) if (!seen[k]) { seen[k] = 1; order.push(k); }\n      }\n      const res = solveGroup(order, [...gc], prior);\n      if (!res) {                                    // 太多组合：退回\"每格按先验\"估算\n        for (const k of order) { p[k] = priorOf(k, prior); for (const [v, q] of p[k]) expUsed[v] += q; }\n        continue;\n      }\n      order.forEach((k, a) => {\n        const nd = dom[k].filter(v => res.tally[a].get(v) > 0);\n        if (nd.length \u003c dom[k].length) {\n          const before = dmax(k);\n          dom[k] = nd; changed = true;\n          if (dmax(k) \u003c be \n  if ((i = firstRev(c => c.t === \"orb\")) >= 0) return {msg: \"用传送门：揭开周围一圈\", target: i, reason: []};\n  if ((i = firstRev(c => [\"sorb\", \"srats\", \"sslimes\", \"sdisarm\", \"irage\", \"iweak\", \"ihammer\", \"iwind\"].includes(c.t))) >= 0) return {msg: \"用道具\", target: i, reason: []};\n  if ((i = firstRev(c => c.t === \"chest\" || (c.t === \"mimic\" && c.mimic))) >= 0) return {msg: \"开宝箱\", target: i, reason: []};\n  for (let k = 0; k \u003c vars.length; k++) if (!hidden(k) && dom[k].length === 1 && dom[k][0] === 0)\n    return {msg: \"开宝箱：\" + explain(S, k, H, \"chest\"), target: vars[k], reason: reasonCell(why[k])};\n  if ((i = firstRev(c => c.t === \"gnome\")) >= 0) return {msg: \"点狐狸：不扣血，它会跳走\", target: i, reason: []};\n\n  // 确定没有伤害的未知格（战力 0；没翻开的宝箱怪第一下只会翻开，不扣血）\n  const zero = [], fight = [];\n  for (let k = 0; k \u003c vars.length; k++) {\n    if (!hidden(k)) { if (dmax(k) \u003c hpF && dom[k].length) fight.push({k, m: dmax(k), cell: vars[k]}); continue; }\n    const m = dmax(k);\n    if (m \u003c= 0) zero.push(k); else if (m \u003c hpF) fight.push({k, m, cell: vars[k]});\n  }\n  if (zero.length) {\n    zero.sort((a, b) => (why[a] ? 0 : 1) - (why[b] ? 0 : 1));\n    const k = zero[0];\n    return {msg: explain(S, k, H, \"zero\"), target: vars[k], reason: reasonCell(why[k])};\n  }\n  // 确定打得过的\n  for (let j = 0; j \u003c N; j++) {\n    const c = cells[j];\n    if (c.rev && vi[j] \u003c 0 && c.mon && !c.def && c.lvl > 0 && effPow(c) \u003c hp) fight.push({k: -1, m: effPow(c), cell: j, known: true});\n  }\n  const guess = bestGuess(S, hpF);\n  const guessMsg = (g, pre) => ({msg: `${pre}黄圈最稳，约 ${Math.max(1, Math.round(g.r * 100))}% 打不过`, target: vars[g.k], reason: []});\n  if (fight.length) {\n    // 把确定能打的全打完也升不了级、手里也没血瓶 → 最后会卡在低血硬猜；不如趁现在血多先猜\n    let xpMin = player.xp;\n    for (const f of fight) xpMin += f.known ? cells[f.cell].xp : Math.min(...dom[f.k].map(v => v === 100 ? 3 : v));\n    const stuck = !ready && xpMin \u003c nextXP(player.level) && firstRev(c => c.t === \"medikit\") \u003c 0;\n    if (stuck && guess) {\n      let hpEnd = hp; for (const f of fight) hpEnd -= f.m;\n      const later = bestGuess(S, Math.max(1, hpEnd));\n      if (guess.r \u003c= TUTOR_OPT.early || guess.r \u003c= later.r * TUTOR_OPT.ratio) return guessMsg(guess, \"能打的打完也升不了级，趁血多先猜：\");\n    }\n    // 打得过龙就直接打龙；其余先打大的：血留给小怪收尾，最后正好打到见底再升级，升级回的血一点不浪费\n    fight.sort((a, b) => (cells[b.cell].t === \"dragon\") - (cells[a.cell].t === \"dragon\") || TUTOR_OPT.order * (b.m - a.m) || (a.known ? 1 : 0) - (b.known ? 1 : 0));\n    const f = fight[0];\n    if (f.known) {\n      const c = cells[f.cell];\n      return {msg: `${DEF[c.t].name} ${effPow(c)} 战力，你战力 ${H}，能打`, target: f.cell, reason: []};\n    }\n    return {msg: explain(S, f.k, H, \"fight\"), target: f.cell, reason: reasonCell(why[f.k])};\n  }\n  if (guess && guess.r \u003c= TUTOR_OPT.cheap && (ready || firstRev(c => c.t === \"medikit\") >= 0)) return guessMsg(guess, \"升级/血瓶留到血少再用，先猜：\");\n  // 反正要回满血了：多余的血先拿去砸墙换经验，不浪费\n  if ((ready || (hp \u003c capHP() && firstRev(c => c.t === \"medikit\") >= 0)) && hp >= 2 && (i = firstRev(c => c.t === \"wall\")) >= 0)\n    return {msg: ready ? \"升级会回满血，先把多余的血拿去砸岩石\" : \"喝血瓶会回满血，先把多余的血拿去砸岩石\", target: i, reason: []};\n  if (ready && hp > 0) return {msg: \"没有安全格了，经验够 → 点主角升级回满血\", target: \"hero\", reason: []};\n  if (hp \u003c capHP() && (i = firstRev(c => c.t === \"medikit\")) >= 0) return {msg: \"没有安全格了 → 喝血瓶回满血\", target: i, reason: []};\n  if ((i = firstRev(c => c.t === \"wall\")) >= 0 && hp > cells[i].whp && (!guess || bestGuess(S, hpF - cells[i].whp).r \u003c= guess.r + TUTOR_OPT.wall)) return {msg: \"砸岩石：每下扣 1 点血，打通后露出数字\", target: i, reason: []};\n  if (!guess) {\n    if ((i = firstRev(c => c.t === \"dragon\" && !c.def)) >= 0) return {msg: `打头目要战力 ${cells[i].lvl}，你只有 ${H}`, target: -1, reason: []};\n    return {msg: \"\", target: -1, reason: []};\n  }\n  return guessMsg(guess, \"没有安全格，只能猜：\");\n}\n\nconst TUTOR_OPT = {early: 0.35, wall: 0.02, ratio: 1, cheap: 0.05, budget: 50000, order: 1};\n// 只能猜时：按剩余数量估算每个格子打不过的概率，挑最低的；同样低时挑挨着数字的（翻开后信息多）\nfunction bestGuess(S, hp) {\n  const {vars, hidden} = S;\n  let best = null;\n  for (let k = 0; k \u003c vars.length; k++) {\n    if (!hidden(k)) continue;\n    let r = 0;\n    for (const [v, q] of S.prob[k]) if (v >= hp && v !== 11) r += q;\n    const i = vars[k];\n    const info = cells.some((b, j) => b.rev && b.t === \"empty\" && Math.abs(X(j) - X(i)) \u003c= 1 && Math.abs(Y(j) - Y(i)) \u003c= 1) ? 1 : 0;\n    if (!best || r \u003c best.r - 1e-9 || (Math.abs(r - best.r) \u003c 1e-9 && info > best.info)) best = {k, r, info};\n  }\n  return best;\n}\n\n// v28：依据要圈全——数字约束里“别的格”如果是靠别的推理定下的，把那些依据也圈出来（1 层）\nlet TUTOR_S = null;\nconst minPos = (S, j) => Math.min(...S.dom[j].filter(v => !(v === 11 && S.hidden(j)))) > 0;\nfunction supportOf(S, k, con) {\n  const out = [];\n  for (const j of con.U) {\n    if (j === k) continue;\n    const w = S.why[j];\n    if (w && w.con !== con && minPos(S, j)) out.push({j, w});   // 只说真的占了数的格\n  }\n  return out;\n}\nfunction reasonCell(w, depth, seen) {\n  if (!w) return [];\n  depth = depth || 0; seen = seen || new Set();\n  if (seen.has(w)) return [];\n  seen.add(w);\n  let r = [];\n  if (w.k === \"num\") r = [w.con.c];\n  else if (w.k === \"enum\") r = w.cons.map(c => c.c);\n  else if (w.k === \"giant\" || w.k === \"garg\") r = [w.c];\n  if (TUTOR_S && depth \u003c 1) {\n    const cons = w.k === \"num\" ? [w.con] : w.k === \"enum\" ? w.cons : [];\n    for (const con of cons) for (const k of con.U) {\n      const w2 = TUTOR_S.why[k];\n      if (w2 && w2.con !== con) r = r.concat(reasonCell(w2, depth + 1, seen));\n    }\n  }\n  return [...new Set(r)];\n}\nfunction supText(S, w, j) {\n  const src = (w.k === \"num\" || w.k === \"enum\") ? \"被别的蓝圈\" : w.k === \"giant\" ? \"按熊对称\" : w.k === \"garg\" ? \"按塔龟箭头\" : \"按剩下的数量\";\n  const d = S.dom[j].filter(v => !(v === 11 && S.hidden(j)));\n  if (d.length === 1) return src + \"定为\" + (d[0] === 100 ? \"炸弹\" : ` ${d[0]}`);\n  return src + `算出至少 ${Math.min(...d)}`;\n}\n\nfunction explain(S, k, H, kind) {\n  TUTOR_S = S;\n  const {dom, why, dmax} = S, w = why[k], m = dmax(k);\n  const exact = dom[k].filter(v => !(v === 11 && S.hidden(k)));\n  let head, tail = \"\";\n  if (w && w.k === \"num\") {\n    const {n, R, c} = w.con;\n    const shown = typeof remainNum === \"function\" ? remainNum(c) : R;\n    if (n === 0) head = \"蓝圈空白 = 周围没怪\";\n    else if (R === 0) head = \"蓝圈 0 = 周围的怪都已看到\";\n    else head = shown === R ? `蓝圈 ${R}` : `蓝圈 ${shown}（不算你的标记是 ${R}）`;\n    const sup = R > 0 ? supportOf(S, k, w.con) : [];\n    if (sup.length === 1) head += `：旁边那格${supText(S, sup[0].w, sup[0].j)}`;\n    else if (sup.length > 1) head += `：旁边 ${sup.length} 格已被别的蓝圈定下`;\n    if (R > 0 && kind !== \"fight\") tail = sup.length ? \"，已凑满\" : \"，别的格已凑满\";\n    else if (kind === \"fight\" && m \u003c R) tail = sup.length ? \"，分走一部分\" : \"，别的格分走一部分\";\n  } else if (w && w.k === \"enum\") head = \"几个蓝圈的数字合起来算\";\n  else if (w && w.k === \"giant\") head = \"两只熊对称\";\n  else if (w && w.k === \"garg\") head = \"塔龟箭头指向同伴\";\n  else if (w && w.k === \"count\") head = `${powLabel(w.v)}都已找到`;\n  else if (w && w.k === \"only\") head = `${powLabel(w.v)}只剩这里能放`;\n  else head = m \u003c= 0 ? \"怪都已找到\" : `剩下的怪最大 ${m}`;\n  const mim = S.hidden(k) && dom[k].includes(11);   // 可能是没现形的宝箱怪：第一下只翻开，算安全\n  if (kind === \"zero\" && mim) return `${head} → 黄圈${dom[k].every(v => v === 11) ? \"是\" : \"可能是\"}宝箱怪（11）：第一下只翻开、不扣血，别点第二下`;\n  head += tail;\n  if (kind === \"zero\") return `${head} → 黄圈没怪`;\n  if (kind === \"chest\") return `${head} → 不是宝箱怪`;\n  const what = exact.length === 1 ? (POW_LABEL[m] ? `是${POW_LABEL[m]}（${m}）` : `是 ${m} 战力`) : `最多 ${m} 战力`;\n  return `${head} → 黄圈${what}，你战力 ${H}，能打`;\n}\n\n// ======================================================================\n//  表现层（v6）：塔塔素材 + 顶部舞台战斗分镜 + 心形血量 / 宝石经验槽 + 波浪翻格 + 长按说明。只读规则状态，不改规则。\n//  分镜和音效对照见 docs\\美术与演出.md「v6」。\n// ====================
