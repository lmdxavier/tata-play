// 版本自检：线上 build.txt 和页面里的号不一样（手机还在用缓存的旧页面）就带新号重新打开
(function () {
  if (location.protocol === 'file:') return;
  fetch('build.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    t = (t || '').trim();
    if (t && t !== window.__BUILD && location.search.indexOf('b=' + t) < 0) { var q = new URLSearchParams(location.search); q.set('b', t); location.replace(location.pathname + '?' + q.toString()); }
  }).catch(function () {});
})();
</script>
