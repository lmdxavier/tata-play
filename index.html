<!-- 36 版：添加到主屏幕后全屏打开（iPhone：Safari 分享 → 添加到主屏幕；安卓：Chrome 菜单 → 添加到主屏幕 / 安装应用） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>塔塔 · M2 素材版 63（宠物页拖动面板不再每帧重画底纹）</title>
<style>
  html,body{margin:0;height:100%;background:#2b3a2a;overflow:hidden;touch-action:none;overscroll-behavior:none;position:fixed;inset:0;   /* 35 版：页面整体固定，拖动时 iOS 不会把页面推走 */
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;left:0;top:0;touch-action:none;display:block;width:100vw;height:100vh}   /* 34 版：实际尺寸由 resize() 按 innerWidth/innerHeight 写成像素（iOS Safari 的 100vh 比可见区域高，底栏会被工具栏挡住） */
  /* 45 版（用户 2026-11-13 iPhone 主屏幕截图：44 版把画布加高到整屏后，底部 47 像素仍然不显示，底栏按钮被裁掉一截）：
     根本原因是 WebKit 的已知问题（bugs.webkit.org 237961）：主屏幕全屏 + viewport-fit=cover 时，html 一旦 position:fixed，
     页面就被限制在少报了状态栏高度的那块区域里，超出的部分一律不画 —— 画布再高也会被裁。
     所以 iPhone 主屏幕模式下不用 position:fixed / overflow:hidden（页面滚动、拖动已由 game.js 的 touchmove 拦截负责），
     页面高度用 100vh 并补上状态栏高度，画布改成普通的绝对定位。Safari 网页、安卓、电脑不走这一段，和 44 版完全一样。 */
  html.ios-sa, html.ios-sa body{position:static;inset:auto;overflow:visible;height:100vh;min-height:calc(100% + env(safe-area-inset-top))}
  html.ios-sa canvas{position:absolute}
</style>
<script>/* 61 版起：版本自检——网页被手机缓存住时自动换成最新的（build.txt 不走缓存）；双击打开不检查 */
window.__BUILD='63';
if(location.protocol!=='file:') fetch('build.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{ t=t.trim(); if(!t||t===window.__BUILD) return;
  const q=new URLSearchParams(location.search); if(q.get('b')===t) return; q.set('b',t); location.replace(location.pathname+'?'+q.toString()); }).catch(()=>{});
</script>
<script>if(navigator.standalone===true) document.documentElement.classList.add('ios-sa');</script>
</head>

<canvas id="c"></canvas>
